    <section class="wrap" style="padding-top: 40px; padding-bottom: 120px">
      <div class="pinboard">
        <figure class="pin reveal" style="--r: -5deg; --pc: var(--pink)">

        </figure>
        <figure class="pin reveal" style="--r: -2deg; --pc: var(--blue)">
          <img src="images/kms-end.jpg" alt="kms★ motion end card: New drops. Never restocked." style="width: 280px; height: 350px" loading="lazy">
          <figcaption style="left: 16px; background: var(--sky)">kms★ end card</figcaption>
        </figure>
        <figure class="pin reveal" style="--r: 4deg; --pc: var(--green)">
          <img src="images/hs-mobile.jpg" alt="Honey Scotch Cakes mobile homepage" style="width: 190px; height: 380px; object-position: top; border: 1.5px solid var(--ink)" loading="lazy">

        <figure class="pin reveal" style="--r: -3deg; --pc: var(--pink)">

        </figure>
        <figure class="pin reveal" style="--r: 2deg; --pc: var(--yellow)">
          <img src="images/modestly-phone.jpg" alt="Modestly product page on a phone showing a pink floral dress" style="width: 220px; height: 398px; object-position: top; border: 1.5px solid var(--ink)" loading="lazy">
